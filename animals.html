<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <title>All animals</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="animal-page">
  <a class="back-home" href="index.html">Back</a>
  <div class="animal-heading">
    <h1>All animals</h1>
    <nav class="all-animal-nav" aria-label="Main">
      <a class="add-button" href="#animal-form">Add</a>
    </nav>
  </div>

  <ul id="animal-list"></ul>

  <form id="animal-form">
    <section class="addNewData">
      <div class="header">
        <h2>Upload Images</h2>
      </div>

      <div class="input-div">
        <p>Drag & Drop images here or <span class="browse">Browse</span></p>
        <input type="file" class="file" multiple accept="image/png, image/jpeg, image/jpg">
      </div>

      <div id="queued-form">
        <div class="header">
          <h3>Queued In Frontend</h3>
        </div>
        <div class="queued-form"></div>
      </div>
    </section>

    <input name="name" placeholder="Name">
    <input name="species" placeholder="Species">
    <input name="breed" placeholder="Breed">
    <input name="gender" placeholder="Gender">
    <input name="age" placeholder="Age">
    <input name="description" placeholder="Description">
    <input name="status" placeholder="Status">
    <button type="submit">Submit</button>
  </form>

  
  <script src="animals.js"></script>
</body>
</html>
